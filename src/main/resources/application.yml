spring:
  datasource:
    url: jdbc:h2:mem:task-db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driverClassName: org.h2.Driver
    username: sa
    password:
    dialect: org.hibernate.dialect.H2Dialect
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    listener:
      simple:
        concurrency: 3       # número mínimo de consumidores concorrentes
        max-concurrency: 10  # número máximo de consumidores concorrentes
        prefetch: 5

  application:
   name: task-hexagonal
